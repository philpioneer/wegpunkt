{% macro logo(size=28) -%}
<svg class="logo" width="{{ size }}" height="{{ size }}" viewBox="0 0 32 32" aria-hidden="true">
  <defs>
    <linearGradient id="wp-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e39a52"/><stop offset=".35" stop-color="#3fae6f"/>
      <stop offset=".7" stop-color="#4b7cf0"/><stop offset="1" stop-color="#b064e3"/>
    </linearGradient>
  </defs>
  <path d="M16 2 30 16 16 30 2 16Z" fill="url(#wp-g)"/>
  <path d="M16 9.5 22.5 16 16 22.5 9.5 16Z" fill="none" stroke="#fff" stroke-width="2.2" opacity=".95"/>
  <circle cx="16" cy="16" r="2.2" fill="#fff"/>
</svg>
{%- endmacro %}
